name: CI

on:
  push:
    branches: [main]
  pull_request:

# A second push to the same branch cancels the first: the only run that matters
# is the one for the newest commit.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, types, data and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # `biome ci` rather than the local `format --write`, which would pass by
      # rewriting the file instead of reporting it.
      - run: npm run check:ci

  build:
    name: Production build
    runs-on: ubuntu-latest
    # The home, games and screen pages read the database at build time, so a
    # build without a connection string fails by design rather than silently
    # producing an empty site. Skipped rather than faked when the secret is
    # absent, so a fork's pull request still gets the check job above.
    if: ${{ github.event_name == 'push' }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run build
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Assert the content routes are still prerendered
        run: npm run check:static
