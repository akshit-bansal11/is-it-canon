name: CI

on:
  push:
    branches: [main]
  pull_request:

# A second push to the same branch cancels the first: the only run that matters
# is the one for the newest commit.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, types, data and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # `biome ci` rather than the local `format --write`, which would pass by
      # rewriting the file instead of reporting it.
      - run: npm run check:ci

  build:
    name: Production build
    runs-on: ubuntu-latest
    # The home, games and screen pages read the database at build time, so a
    # build without a connection string fails by design rather than silently
    # producing an empty site. Skipped rather than faked when the secret is
    # absent, so a fork's pull request still gets the check job above.
    if: ${{ github.event_name == 'push' }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run build
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Assert the content routes are still prerendered
        run: npm run check:static

  e2e:
    name: Browser tests
    runs-on: ubuntu-latest
    # Playwright builds and starts the app itself (see playwright.config.ts), and
    # the content pages read the database at build time, so this job needs the
    # same connection string the build job does. Gated identically: skipped
    # rather than faked when the secret is absent.
    if: ${{ github.event_name == 'push' }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Chromium only. playwright.config.ts declares one project, so installing
      # the other two engines would download ~300 MB nothing runs.
      - run: npx playwright install --with-deps chromium

      - run: npm run test:e2e
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      # `reporter: "list"` prints one line per failure and nothing else, which is
      # not enough to diagnose a failure that only reproduces on the runner. The
      # config traces on first retry; without this the trace is thrown away.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
